<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hurdle Highway 2D</title>
    <link rel="stylesheet" href="sheet/css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bogle&display=swap" rel="stylesheet">
</head>

<body>

    <div id="mainMenu">
        <div class="titleContainer">
            <p id="maintitle1">
                HURDLE
            </p>
            <p id="maintitle2">
                HIGHWAY
            </p>
            <p id="maintitle3">
                2D
            </p>
        </div>
        <div id="playbtn">
            PLAY NOW
        </div>
        <div id="credits">
            <p id="name1">
                BY
            </p>
            <p id="name2">
                ARJUN SHUKLA
            </p>
        </div>
    </div>
    <div class="scoreboard">
        <p id="scorepara1">
            SCORE - 0
        </p>
        <p id="scorepara2">
            SPEED - 0 KM/H
        </p>

    </div>
    <div id="gameover">
        <p id="scorepara">
            YOUR SCORE - 0
        </p>
        <div id="playagain">
            PLAY AGAIN
        </div>
        <div id="mainMenubtn">
            MAIN MENU
        </div>
    </div>

    <div class="obstackle-conatiner">

        <img src="sheet/media/cone2n.png" alt="obs1" id="obs1" height="17%" width="8%">
        <img src="sheet/media/hurdle.png" alt="" id="obs2" height="20%" width="10%">
        <img src="sheet/media/obs5-removebg-preview.png" alt="" id="obs9" height="30%" width="15%">
        <img src="sheet/media/cave1.png" alt="" id="obs3" height="20%" width="10%">
        <img src="sheet/media/obs4-removebg-preview.png" alt="" id="obs4" height="20%" width="10%">
        <img src="sheet/media/obs8.png" alt="" id="obs5" height="18%" width="6%">
        <img src="sheet/media/obs6-removebg-preview.png" alt="" id="obs6" height="30%" width="10%">
        <img src="sheet/media/obs7.png" alt="" id="obs7" height="20%" width="10%">
        <img src="sheet/media/obs6-removebg-preview.png" alt="" id="obs8" height="30%" width="10%">
    </div>

    <div class="car-container">

        <img src="sheet/media/formula1-removebg-preview.png" id="car" alt="racing car" height="30%" width="15%">
    </div>

    <script src="sheet/js/index.js"></script>
</body>

</html>
